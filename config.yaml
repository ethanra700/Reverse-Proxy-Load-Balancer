listen_addr: ":8080"

health_check:
  interval: 5s
  timeout: 2s
  path: "/health"
  unhealthy_threshold: 3

transport:
  max_idle_conns: 256
  max_idle_conns_per_host: 64
  idle_conn_timeout: 90s
  dial_timeout: 5s
  response_header_timeout: 10s

pools:
  http-backends:
    backends:
      - "http://localhost:8081"
      - "http://localhost:8082"
      - "http://localhost:8083"
  grpc-backends:
    protocol: "h2c"
    backends:
      - "http://localhost:9001"
      - "http://localhost:9002"
      - "http://localhost:9003"

routes:
  - prefix: "/api"
    pool: "http-backends"
  - prefix: "/echo.EchoService"
    pool: "grpc-backends"
  - prefix: "/grpc"
    pool: "grpc-backends"
  - prefix: "/"
    pool: "http-backends"
