syntax = "proto3";

package echo;

option go_package = "github.com/ethanra700/Reverse-Proxy-Load-Balancer/cmd/dummy-grpc/proto;echopb";

service EchoService {
  rpc Ping (PingRequest) returns (PongResponse);
}

message PingRequest {
  string message = 1;
}

message PongResponse {
  string backend_id = 1;
  string message = 2;
}
